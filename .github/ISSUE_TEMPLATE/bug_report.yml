name: Reporte de bug
description: El análisis, el escáner o la Action no funcionan como se documenta
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué ocurre
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: dropdown
    id: componente
    attributes:
      label: Componente
      options:
        - analyze (repo local)
        - scan (GitHub)
        - GitHub Action
        - Docker
        - CI
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión / commit
      placeholder: "repo-analyzer --version o git rev-parse --short HEAD"
    validations:
      required: true
  - type: textarea
    id: salida
    attributes:
      label: Salida / informe
      render: shell
