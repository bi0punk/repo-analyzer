name: Self analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar la Action sobre este repo
        uses: ./
        with:
          path: .
          output-dir: reports
      - name: Publicar resumen
        run: |
          echo "### Repo Analyzer" >> "$GITHUB_STEP_SUMMARY"
          head -n 40 reports/repo_diagnostic.md >> "$GITHUB_STEP_SUMMARY"
