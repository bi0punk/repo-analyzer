name: Repo Analyzer
description: Genera un diagnóstico del repositorio y un bundle de contexto para LLM.
author: bi0punk

branding:
  icon: search
  color: blue

inputs:
  path:
    description: Ruta del repositorio a analizar
    required: false
    default: "."
  output-dir:
    description: Directorio donde dejar los reportes
    required: false
    default: "repo-analyzer-output"
  llm-max-input-tokens:
    description: Presupuesto máximo de tokens para el contexto del LLM
    required: false
    default: "24000"
  upload-artifact:
    description: Subir los reportes como artefacto del workflow
    required: false
    default: "true"

outputs:
  report:
    description: Ruta del informe Markdown generado
    value: ${{ steps.analyze.outputs.report }}

runs:
  using: composite
  steps:
    - name: Instalar repo-analyzer
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Analizar repositorio
      id: analyze
      shell: bash
      run: |
        set -euo pipefail
        repo-analyzer analyze "${{ inputs.path }}" \
          --output-dir "${{ inputs.output-dir }}" \
          --llm-max-input-tokens "${{ inputs.llm-max-input-tokens }}"
        echo "report=${INPUT_OUTPUT_DIR}/repo_diagnostic.md" >> "$GITHUB_OUTPUT"
      env:
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}

    - name: Subir artefacto
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: repo-analyzer-report
        path: ${{ inputs.output-dir }}
        if-no-files-found: error
