[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-scanner-mvp"
version = "0.1.0"
description = "MVP scanner for GitHub repositories with optional llama.cpp enrichment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
repo-analyze = "repo_agent.cli:main"
repo-scan = "repo_scanner_mvp.cli:main"

[tool.setuptools]
packages = ["repo_agent", "repo_scanner_mvp"]
package-dir = {"repo_scanner_mvp" = "src/repo_scanner_mvp"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
